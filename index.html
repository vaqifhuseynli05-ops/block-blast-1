<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block Blast - Custom Image</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <h1>Block Blast</h1>
    <div class="score-board">Xal: <span id="score">0</span></div>
    
    <div class="controls">
      <label for="imageUpload" class="upload-btn">Şəkil Seç</label>
      <input type="file" id="imageUpload" accept="image/*">
    </div>

    <!-- 8x8 Oyun Lövhəsi -->
    <div id="grid" class="grid"></div>

    <!-- Blokların gələcəyi sahə -->
    <div id="pieces-container" class="pieces-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
